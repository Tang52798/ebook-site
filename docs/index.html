<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="电子书站点模板 - 支持 JSON 数据驱动与前端实时搜索" />
  <meta name="keywords" content="电子书, 搜索, JSON, GitHub Pages" />
  <meta name="author" content="Your Project" />
  <meta name="robots" content="index, follow" />
  <title>电子书站点模板</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a2f;
      --text: #e8ecf8;
      --muted: #9aa4c7;
      --primary: #6ea8fe;
      --accent: #7ee0c6;
      --border: #2a355a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #101933 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      padding: 24px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
    }
    .card {
      background: rgba(18, 26, 47, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
    }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p { color: var(--muted); margin-bottom: 10px; }
    .stats {
      margin: 18px 0 22px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .stat {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #0f1730;
    }
    .stat .label { color: var(--muted); font-size: 13px; }
    .stat .value { color: var(--accent); font-weight: 700; font-size: 1.2rem; margin-top: 6px; }
    .search-wrap { margin-top: 8px; }
    #search-input {
      width: 100%;
      background: #0d1530;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
      font-size: 15px;
    }
    #search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.2);
    }
    .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    #search-results { margin-top: 16px; }
    .empty {
      margin-top: 20px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 16px;
      color: var(--muted);
      background: #0f1730;
    }
    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <h1>📚 电子书站点模板</h1>
      <p>该页面已清空原始内容，仅保留功能框架。你可以通过维护 <code>all-books.json</code> / <code>books.json</code> 重新上传自己的书籍数据。</p>

      <div class="stats">
        <div class="stat">
          <div class="label">总书籍数</div>
          <div class="value" id="total-books">0 本</div>
        </div>
        <div class="stat">
          <div class="label">分类数量</div>
          <div class="value" id="total-categories">0 个</div>
        </div>
        <div class="stat">
          <div class="label">状态</div>
          <div class="value">可二次开发</div>
        </div>
      </div>

      <section class="search-wrap">
        <input
          type="text"
          id="search-input"
          placeholder="搜索 书名 / 作者 / 分类（支持多关键词）"
          oninput="onSearch(event)"
          autocomplete="off"
          aria-label="搜索书籍"
        />
        <div class="hint">提示：当前为初始空数据状态，上传数据后即可实时搜索。</div>
        <div id="search-results" role="region" aria-live="polite"></div>
      </section>

      <div class="empty">
        当前未展示任何预置电子书、赞赏记录或原项目信息。
      </div>
    </main>

    <footer>
      由 GitHub Pages 托管 · 前端搜索由 <code>search.js</code> 驱动
    </footer>
  </div>

  <script src="search.js"></script>
  <script>
    (async function updateStats() {
      let data = [];
      try {
        const r1 = await fetch("all-books.json");
        if (r1.ok) data = await r1.json();
        if (!Array.isArray(data) || data.length === 0) {
          const r2 = await fetch("books.json");
          if (r2.ok) data = await r2.json();
        }
      } catch (e) {}
      if (!Array.isArray(data)) data = [];
      const totalBooks = data.length;
      const categories = new Set(data.map(i => (i && i.category) || "").filter(Boolean)).size;
      document.getElementById("total-books").textContent = `${totalBooks} 本`;
      document.getElementById("total-categories").textContent = `${categories} 个`;
    })();
  </script>
</body>
</html>
